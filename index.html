html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 "DM Sans",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);color:var(--tx)}
.ser{font-family:"Playfair Display",Georgia,serif}.scr{font-family:"Pinyon Script",cursive}
.lg{display:inline-block;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bd)}
header h1{flex:1;font:700 22px "Playfair Display",serif}
.ic{padding:5px;display:grid;place-items:center;position:relative}.ic svg,.pill svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:0;right:0;background:var(--ac);color:var(--on);border-radius:9px;font-size:10px;padding:0 5px}
main{flex:1;min-height:0;overflow-y:auto;padding-bottom:110px}main.nb{padding:0;overflow:hidden}
nav{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5}
.pill{flex:1;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:40px;padding:10px 6px;box-shadow:0 6px 24px #0004}
.pill button{color:var(--mu);padding:4px 8px}.pill .on{color:var(--tx)}.pill .on svg{stroke-width:2.6}
.mebtn{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--bd);background:var(--card);padding:0}
.av{display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on);font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto}
.st{text-align:center;font-size:12px;color:var(--mu);flex:none;width:68px;cursor:pointer}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),var(--ac));width:68px;height:68px;position:relative}.ring .av{width:100%;height:100%;border:3px solid var(--bg)}
.ring.no{background:var(--bd)}.ring b{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:16px;border:2px solid var(--bg)}
.post{border-bottom:1px solid var(--bd);padding-bottom:6px}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}.ph small{display:block;color:var(--mu);font-size:12px}
.vf{color:var(--ac);width:15px;height:15px;vertical-align:-2px;fill:currentColor}
.art{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,var(--bg),var(--card) 60%,var(--ac2) 220%);color:var(--ac);position:relative;overflow:hidden}
.art i{width:46%;height:46%}.art::before{content:"";position:absolute;inset:0;opacity:.08;background:repeating-conic-gradient(var(--ac) 0 25%,transparent 0 50%) 0 0/34px 34px}
.media{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--card)}
.act{display:flex;gap:16px;padding:10px 16px 4px}.act svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act .on{color:var(--ac)}.act .lk.on svg{fill:currentColor}
.cap{padding:0 16px}.mu{color:var(--mu)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}.row .g{flex:1;min-width:0}.row .g span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);font-size:13px}
h3{padding:14px 16px 6px;font:700 19px "Playfair Display",serif}
.over{position:absolute;inset:0;background:var(--bg);color:var(--tx);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;background:var(--card);color:var(--tx);border-radius:22px 22px 0 0;z-index:30;padding:16px;overflow-y:auto;box-shadow:0 -10px 40px #0007;display:flex;flex-direction:column;gap:10px}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:10px 14px;font:inherit;outline:none}input:focus-visible,textarea:focus-visible{border-color:var(--ac)}
input[type=color]{padding:0;height:38px;border-radius:12px}
.btn{background:var(--ac);color:var(--on);border-radius:22px;padding:10px 18px;font-weight:700}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
